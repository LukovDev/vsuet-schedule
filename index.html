<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- http → https: без https офлайн-режим не работает -->
<script>if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') location.replace('https:' + location.href.slice(5));</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>Расписание</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --line: #e0e4ea;
    --text: #10151c;
    --muted: #5b6574;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --accent-soft: #e3ebfc;
    --accent-text: #1d4ed8;
    --tag: #eef1f5;
    --ease: cubic-bezier(.25, .8, .25, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #151b23;
      --line: #252d38;
      --text: #e6ebf1;
      --muted: #8d98a7;
      --accent: #2f6fe8;
      --accent-ink: #ffffff;
      --accent-soft: #1a2b48;
      --accent-text: #93b8ff;
      --tag: #1e2530;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    margin: 0;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
  }

  /* шапка */
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .head h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .head span { color: var(--muted); font-size: 13px; }

  /* плашка, которая переезжает под выбранную кнопку */
  .thumb {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    transition: transform .32s var(--ease), width .32s var(--ease), height .32s var(--ease);
  }
  .thumb.instant { transition: none; }

  /* группа + подгруппа */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg {
    position: relative;
    flex: 1 1 200px;
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .seg::-webkit-scrollbar { display: none; }
  .seg.sub { flex-basis: 250px; }
  .seg[hidden] { display: none; }
  .seg .thumb { border-radius: 9px; background: var(--accent-soft); }
  .seg button {
    position: relative;
    z-index: 1;
    flex: 1 0 auto;
    height: 38px;
    padding: 0 12px;
    border-radius: 9px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: color .25s, transform .12s var(--ease);
  }
  .seg button:active { transform: scale(.95); }
  .seg button[aria-pressed="true"] { color: var(--accent-text); }

  /* дни */
  .days {
    position: relative;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin: 12px 0 20px;
  }
  .days .thumb { border-radius: 12px; background: var(--accent); }
  .days button {
    position: relative;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    transition: color .25s, border-color .25s;
  }
  .days button > span,
  .days button > small { position: relative; z-index: 1; }
  .days small {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    transition: color .25s;
  }
  .days button.off { color: var(--muted); }
  .days button.today::after {
    content: '';
    position: absolute;
    z-index: 1;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    transition: background-color .25s;
  }
  .days button[aria-pressed="true"] { color: var(--accent-ink); border-color: transparent; }
  .days button[aria-pressed="true"] small { color: inherit; opacity: .8; }
  .days button[aria-pressed="true"].today::after { background: var(--accent-ink); }

  @media (hover: hover) {
    .seg button[aria-pressed="false"]:hover { color: var(--text); }
    .days button[aria-pressed="false"]:hover { border-color: var(--muted); }
  }

  /* список пар */
  .list {
    min-height: 55vh;              /* чтобы свайпать можно было и по пустому месту */
    touch-action: pan-y pinch-zoom;
  }
  .dayhead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 2px 10px;
  }
  .dayhead h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .dayhead em {
    font-style: normal;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-text);
    margin-left: 8px;
  }
  .dayhead span { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .lessons {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .lesson {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 10px;
    padding: 12px 14px;
  }
  .lesson + .lesson { border-top: 1px solid var(--line); }
  .when { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
  .when b { font-size: 15px; font-weight: 700; }
  .when .end { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .when .num { margin-top: 3px; font-size: 11.5px; color: var(--muted); }

  .item + .item { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .subj { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .room { color: var(--text); font-weight: 600; }
  .tag {
    font-size: 11.5px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 6px;
    background: var(--tag);
    color: var(--muted);
  }
  .tag.sg { background: var(--accent-soft); color: var(--accent-text); }

  .empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 14px;
  }

  /* строки появляются по очереди при смене группы/подгруппы */
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }
  .stagger .dayhead,
  .stagger .lesson,
  .stagger .empty {
    animation: rowIn .32s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 35ms);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app">

  <header class="head">
    <h1 id="title">Расписание</h1>
    <span id="subtitle"></span>
  </header>

  <div class="controls">
    <div class="seg" id="group" role="group" aria-label="Группа"></div>
    <div class="seg sub" id="sub" role="group" aria-label="Подгруппа"></div>
  </div>

  <nav class="days" id="days" aria-label="День недели"></nav>

  <section class="list" id="list"></section>
</main>

<!-- Всё расписание лежит в schedule.js -->
<script src="schedule.js"></script>
<script>
const DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб"];

const groupEl = document.getElementById('group');
const subEl = document.getElementById('sub');
const daysEl = document.getElementById('days');
const listEl = document.getElementById('list');

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

if (typeof SCHEDULE === 'undefined'){
  listEl.append(el('div', 'empty', 'Не найден файл schedule.js рядом с index.html'));
  throw new Error('schedule.js не загружен');
}

const S = SCHEDULE;
const GROUPS = Object.keys(S.groups);

const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
};

const todayIdx = (new Date().getDay() + 6) % 7;   // Пн = 0 … Вс = 6

const state = {
  group: GROUPS.includes(store.get('rasp.group')) ? store.get('rasp.group') : GROUPS[0],
  sub: store.get('rasp.sub') || 'all',
  day: todayIdx < 6 ? todayIdx : 0                 // в воскресенье сразу показываем понедельник
};

/* ---------- данные ---------- */

function toMin(t){
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function fmt(min){
  return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0');
}

// время пары: своё (time у занятия) → звонки дня → общие звонки; конец = начало + pairMinutes
function timeOf(day, pair, own){
  const bells = S.bells || {};
  const raw = own || (bells[day] && bells[day][pair]) || (bells.default && bells.default[pair]) || '';
  const [start, end] = String(raw).split(/\s*[-–]\s*/);
  if (!start) return { start: '?', end: '?' };
  return { start, end: end || fmt(toMin(start) + (S.pairMinutes || 90)) };
}

// разворачиваем pair: [3, 4] в две отдельные пары
function lessonsOf(group, day){
  const out = [];
  for (const l of (S.groups[group] || {})[day] || []){
    for (const p of [].concat(l.pair)) out.push(Object.assign({}, l, { pair: p }));
  }
  return out;
}

function subsOf(group){
  const set = new Set();
  for (const day of DAYS) for (const l of lessonsOf(group, day)) if (l.sub) set.add(String(l.sub));
  return [...set].sort();
}

function slotsFor(group, dayIdx){
  const day = DAYS[dayIdx];
  const map = new Map();
  for (const l of lessonsOf(group, day)){
    if (state.sub !== 'all' && l.sub && String(l.sub) !== state.sub) continue;
    if (!map.has(l.pair)) map.set(l.pair, { pair: l.pair, time: timeOf(day, l.pair, l.time), lessons: [] });
    map.get(l.pair).lessons.push(l);
  }
  return [...map.values()].sort((a, b) => a.pair - b.pair);
}

function pairs(n){
  const a = n % 10, b = n % 100;
  const w = a === 1 && b !== 11 ? 'пара' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'пары' : 'пар';
  return n + ' ' + w;
}

/* ---------- переключатели ---------- */

function moveThumb(container, btn, instant){
  const t = container.querySelector(':scope > .thumb');
  if (!t || !btn) return;
  t.classList.toggle('instant', !!instant);
  t.style.width = btn.offsetWidth + 'px';
  t.style.height = btn.offsetHeight + 'px';
  t.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
  if (instant){ void t.offsetWidth; t.classList.remove('instant'); }
}

function buildSeg(segEl, items){
  segEl.replaceChildren(el('div', 'thumb'), ...items.map(([v, label]) => {
    const b = el('button', null, label);
    b.type = 'button';
    b.dataset.v = v;
    return b;
  }));
}

function setSeg(segEl, value, instant){
  let active = null;
  for (const b of segEl.querySelectorAll('button')){
    const on = b.dataset.v === value;
    b.setAttribute('aria-pressed', on);
    if (on) active = b;
  }
  moveThumb(segEl, active, instant);
  if (active && segEl.scrollWidth > segEl.clientWidth){
    active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: instant ? 'auto' : 'smooth' });
  }
}

// подгруппы берём из данных выбранной группы; если их нет — переключатель прячется
let subKey = null;
function syncSubs(){
  const subs = subsOf(state.group);
  if (!['all', ...subs].includes(state.sub)) state.sub = 'all';
  const key = subs.join(',');
  if (key === subKey) return false;
  subKey = key;
  subEl.hidden = !subs.length;
  buildSeg(subEl, [['all', 'Все'], ...subs.map(s => [s, s + ' подгр.'])]);
  return true;
}

buildSeg(groupEl, GROUPS.map(g => [g, g]));

const dayBtns = DAYS.map((name, i) => {
  const b = el('button');
  b.type = 'button';
  b.dataset.i = i;
  b.classList.toggle('today', i === todayIdx);
  b.append(el('span', null, SHORT[i]), el('small'));
  return b;
});
daysEl.append(...dayBtns, el('div', 'thumb'));

/* ---------- отрисовка ---------- */

function lessonItem(l){
  const item = el('div', 'item');
  item.append(el('div', 'subj', l.subject));
  const meta = el('div', 'meta');
  if (l.room) meta.append(el('span', 'room', l.room));
  if (l.teacher) meta.append(el('span', null, l.teacher));
  if (l.type) meta.append(el('span', 'tag', l.type));
  if (l.sub && state.sub === 'all') meta.append(el('span', 'tag sg', l.sub + ' подгр.'));
  if (l.code) meta.append(el('span', 'tag', l.code));
  item.append(meta);
  return item;
}

function renderList(){
  const slots = slotsFor(state.group, state.day);

  const head = el('div', 'dayhead');
  const h = el('h2', null, DAYS[state.day]);
  if (state.day === todayIdx) h.append(el('em', null, 'сегодня'));
  head.append(h, el('span', null, slots.length
    ? pairs(slots.length) + ' · ' + slots[0].time.start + ' – ' + slots[slots.length - 1].time.end
    : ''));

  let body;
  if (!slots.length){
    body = el('div', 'empty', 'Пар нет');
    body.style.setProperty('--i', 1);
  } else {
    body = el('ol', 'lessons');
    slots.forEach((s, i) => {
      const li = el('li', 'lesson');
      li.style.setProperty('--i', i + 1);
      const when = el('div', 'when');
      when.setAttribute('aria-label', `${s.pair} пара, с ${s.time.start} до ${s.time.end}`);
      when.append(el('b', null, s.time.start), el('span', 'end', '– ' + s.time.end), el('span', 'num', s.pair + ' пара'));
      const what = el('div');
      s.lessons.forEach(l => what.append(lessonItem(l)));
      li.append(when, what);
      body.append(li);
    });
  }
  listEl.replaceChildren(head, body);
}

// anim: 'slide' (смена дня), 'stagger' (смена группы/подгруппы) или ничего (первый показ)
function render(anim, dir){
  const instant = !anim;
  const subsRebuilt = syncSubs();

  setSeg(groupEl, state.group, instant);
  setSeg(subEl, state.sub, instant || subsRebuilt);

  dayBtns.forEach((b, i) => {
    const n = slotsFor(state.group, i).length;
    b.setAttribute('aria-pressed', i === state.day);
    b.setAttribute('aria-label', DAYS[i] + (i === todayIdx ? ', сегодня' : '') + ', ' + (n ? pairs(n) : 'пар нет'));
    b.classList.toggle('off', !n);
    b.lastChild.textContent = n || '—';
  });
  moveThumb(daysEl, dayBtns[state.day], instant);

  listEl.classList.toggle('stagger', anim === 'stagger' || !anim);
  renderList();

  if (anim === 'slide' && !reduceMotion.matches){
    listEl.animate(
      [{ opacity: 0, transform: `translateX(${dir * 40}px)` }, { opacity: 1, transform: 'none' }],
      { duration: 260, easing: 'cubic-bezier(.25, .8, .25, 1)' }
    );
  }
}

function goDay(i){
  if (i < 0 || i >= DAYS.length || i === state.day) return;
  const dir = i > state.day ? 1 : -1;
  state.day = i;
  render('slide', dir);
}

/* ---------- события ---------- */

// смена группы/подгруппы НЕ сбрасывает выбранный день
groupEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.v === state.group) return;
  state.group = b.dataset.v;
  store.set('rasp.group', state.group);
  render('stagger');
});

subEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.dataset.v === state.sub) return;
  state.sub = b.dataset.v;
  store.set('rasp.sub', state.sub);
  render('stagger');
});

daysEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) goDay(+b.dataset.i);
});

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') goDay(state.day + 1);
  else if (e.key === 'ArrowLeft') goDay(state.day - 1);
});

// свайп: список едет за пальцем, отпустил дальше 60px — соседний день
let drag = null;

listEl.addEventListener('touchstart', e => {
  drag = null;
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  drag = { x: t.clientX, y: t.clientY, dx: 0, axis: null };
}, { passive: true });

listEl.addEventListener('touchmove', e => {
  if (!drag) return;
  const t = e.touches[0];
  const dx = t.clientX - drag.x, dy = t.clientY - drag.y;
  if (!drag.axis){
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (drag.axis !== 'x') return;
  drag.dx = dx;
  if (reduceMotion.matches) return;
  const atEdge = (dx > 0 && state.day === 0) || (dx < 0 && state.day === DAYS.length - 1);
  const shift = dx * (atEdge ? 0.2 : 0.6);
  listEl.style.transform = `translateX(${shift}px)`;
  listEl.style.opacity = String(1 - Math.min(Math.abs(shift) / 400, 0.5));
}, { passive: true });

function endDrag(){
  if (!drag || drag.axis !== 'x'){ drag = null; return; }
  const dx = drag.dx;
  drag = null;

  const dir = dx < 0 ? 1 : -1;
  const next = state.day + dir;
  const from = { transform: listEl.style.transform || 'none', opacity: listEl.style.opacity || '1' };
  listEl.style.transform = '';
  listEl.style.opacity = '';

  const canGo = Math.abs(dx) > 60 && next >= 0 && next < DAYS.length;
  if (reduceMotion.matches){
    if (canGo) goDay(next);
    return;
  }
  if (canGo){
    const out = listEl.animate(
      [from, { transform: `translateX(${-dir * 80}px)`, opacity: 0 }],
      { duration: 120, easing: 'ease-in', fill: 'forwards' }
    );
    setTimeout(() => { goDay(next); out.cancel(); }, 120);
  } else {
    listEl.animate([from, { transform: 'none', opacity: 1 }], { duration: 220, easing: 'cubic-bezier(.25, .8, .25, 1)' });
  }
}
listEl.addEventListener('touchend', endDrag);
listEl.addEventListener('touchcancel', endDrag);

// при изменении ширины плашки переставляем без анимации
new ResizeObserver(() => {
  moveThumb(groupEl, groupEl.querySelector('[aria-pressed="true"]'), true);
  moveThumb(subEl, subEl.querySelector('[aria-pressed="true"]'), true);
  moveThumb(daysEl, dayBtns[state.day], true);
}).observe(document.querySelector('.app'));

/* ---------- старт ---------- */

document.getElementById('title').textContent = S.title || 'Расписание';
document.getElementById('subtitle').textContent = S.subtitle || '';
document.title = (S.title || 'Расписание') + ' · ' + GROUPS.join(' / ');

render();

// офлайн-режим (работает только на http/https, не при открытии файла с диска)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
