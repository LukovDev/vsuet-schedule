<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<title>Расписание ИСП-245 / ИСП-246</title>
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --line: #e0e4ea;
    --text: #10151c;
    --muted: #5b6574;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --accent-soft: #e3ebfc;
    --accent-text: #1d4ed8;
    --tag: #eef1f5;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #151b23;
      --line: #252d38;
      --text: #e6ebf1;
      --muted: #8d98a7;
      --accent: #2f6fe8;
      --accent-ink: #ffffff;
      --accent-soft: #1a2b48;
      --accent-text: #93b8ff;
      --tag: #1e2530;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    margin: 0;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(28px + env(safe-area-inset-bottom, 0px));
  }

  /* шапка */
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .head h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .head span { color: var(--muted); font-size: 13px; }

  /* группа + подгруппа */
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg {
    flex: 1 1 200px;
    display: flex;
    gap: 2px;
    padding: 3px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .seg.sub { flex-basis: 250px; }
  .seg button {
    flex: 1;
    height: 38px;
    border-radius: 9px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: background-color .12s, color .12s;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }

  /* дни */
  .days {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin: 12px 0 20px;
  }
  .days button {
    position: relative;
    height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    transition: background-color .12s, border-color .12s, color .12s;
  }
  .days small {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .days button.off { color: var(--muted); }
  .days button.today::after {
    content: '';
    position: absolute;
    top: 6px;
    right: 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }
  .days button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .days button[aria-pressed="true"] small { color: inherit; opacity: .8; }
  .days button[aria-pressed="true"].today::after { background: var(--accent-ink); }

  @media (hover: hover) {
    .seg button[aria-pressed="false"]:hover { color: var(--text); }
    .days button[aria-pressed="false"]:hover { border-color: var(--muted); }
  }

  /* список пар */
  .dayhead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 0 2px 10px;
  }
  .dayhead h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .dayhead em {
    font-style: normal;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-text);
    margin-left: 8px;
  }
  .dayhead span { color: var(--muted); font-size: 13px; white-space: nowrap; }

  .lessons {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .lesson {
    display: grid;
    grid-template-columns: 46px 1fr;
    gap: 12px;
    padding: 12px 14px;
  }
  .lesson + .lesson { border-top: 1px solid var(--line); }
  .when { display: flex; flex-direction: column; }
  .when b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .when span { font-size: 12px; color: var(--muted); }

  .item + .item { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .subj { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .room { color: var(--text); font-weight: 600; }
  .tag {
    font-size: 11.5px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 6px;
    background: var(--tag);
    color: var(--muted);
  }
  .tag.sg { background: var(--accent-soft); color: var(--accent-text); }

  .empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 14px;
  }

  .foot {
    margin-top: 24px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
<main class="app">

  <header class="head">
    <h1>Расписание</h1>
    <span>ФСПО · 3 курс</span>
  </header>

  <div class="controls">
    <div class="seg" id="group" role="group" aria-label="Группа"></div>
    <div class="seg sub" id="sub" role="group" aria-label="Подгруппа">
      <button type="button" data-v="all">Все</button>
      <button type="button" data-v="1">1 подгр.</button>
      <button type="button" data-v="2">2 подгр.</button>
    </div>
  </div>

  <nav class="days" id="days" aria-label="День недели"></nav>

  <section id="list"></section>

  <footer class="foot">
    По расписанию деканата ФСПО, только пары с жёлтой заливкой.<br>
    Свайп влево/вправо или стрелки — соседний день.
  </footer>
</main>

<script>
const DATA = {"ИСП-245": {"Понедельник": [{"num": "3", "time": "11:50", "lessons": [{"subject": "МЕНЕДЖМЕНТ В ПРОФЕССИОНАЛЬНОЙ ДЕЯТЕЛЬНОСТИ", "type": "", "subgroup": "", "teacher": "Пащинская Л.И.", "room": "а. 542 С И В"}]}, {"num": "4", "time": "13:35", "lessons": [{"subject": "МЕНЕДЖМЕНТ В ПРОФЕССИОНАЛЬНОЙ ДЕЯТЕЛЬНОСТИ", "type": "", "subgroup": "", "teacher": "Пащинская Л.И.", "room": "а. 542 С И В"}]}], "Вторник": [{"num": "3", "time": "11:50", "lessons": [{"subject": "БЖД", "type": "", "subgroup": "", "teacher": "Жесткова Т.В.", "room": "а. 3 а"}]}, {"num": "4", "time": "13:35", "lessons": [{"subject": "БЖД", "type": "", "subgroup": "", "teacher": "Жесткова Т.В.", "room": "а. 3 а"}]}, {"num": "5", "time": "15:20", "lessons": [{"subject": "ОСНОВЫ СОЦИОЛОГИИ И ПОЛИТОЛОГИИ", "type": "", "subgroup": "", "teacher": "Тыртычный А.Э.", "room": "а. 6"}]}, {"num": "6", "time": "17:05", "lessons": [{"subject": "ОСНОВЫ СОЦИОЛОГИИ И ПОЛИТОЛОГИИ", "type": "", "subgroup": "", "teacher": "Тыртычный А.Э.", "room": "а. 6"}]}], "Среда": [{"num": "1", "time": "8:00", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "лаб.", "subgroup": "1 под.", "teacher": "Резникова В.Ю.", "room": "а. 18"}]}, {"num": "2", "time": "9:45", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "лаб.", "subgroup": "1 под.", "teacher": "Резникова В.Ю.", "room": "а. 18"}]}, {"num": "3", "time": "11:50", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "лаб.", "subgroup": "2 под.", "teacher": "Резникова В.Ю.", "room": "а. 18"}]}, {"num": "4", "time": "13:35", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "лаб.", "subgroup": "2 под.", "teacher": "Резникова В.Ю.", "room": "а. 18"}]}], "Четверг": [{"num": "3", "time": "11:50", "lessons": [{"subject": "ИНОСТРАННЫЙ ЯЗЫК В ПРОФЕССИОНАЛЬНОЙ ДЕЯТЕЛЬНОСТИ", "type": "", "subgroup": "", "teacher": "Епишова И.Н.", "room": "а. Общ. 2"}]}, {"num": "4", "time": "13:35", "lessons": [{"subject": "ФИЗИЧЕСКАЯ КУЛЬТУРА спорт.зал,тренажерный зал, стадион", "type": "", "subgroup": "", "teacher": "Калугин С.Л., Платонов Э.В., Тихонов М.С.", "room": ""}]}, {"num": "5", "time": "15:20", "lessons": [{"subject": "СТАНДАРТИЗАЦИЯ, СЕРТИФИКАЦИЯ И ТЕХНИЧЕСКОЕ ДОКУМЕНТОВЕДЕНИЕ", "type": "", "subgroup": "", "teacher": "Пачевская Е.Н.", "room": "а. 6"}]}, {"num": "6", "time": "17:05", "lessons": [{"subject": "СТАНДАРТИЗАЦИЯ, СЕРТИФИКАЦИЯ И ТЕХНИЧЕСКОЕ ДОКУМЕНТОВЕДЕНИЕ", "type": "", "subgroup": "", "teacher": "Пачевская Е.Н.", "room": "а. 6"}]}], "Пятница": [], "Суббота": [{"num": "3", "time": "11:30", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "теория", "subgroup": "", "teacher": "Резникова В.Ю.", "room": "а."}]}, {"num": "4", "time": "13:10", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "теория", "subgroup": "", "teacher": "Резникова В.Ю.", "room": "а."}]}]}, "ИСП-246": {"Понедельник": [{"num": "3", "time": "11:50", "lessons": [{"subject": "МЕНЕДЖМЕНТ В ПРОФЕССИОНАЛЬНОЙ ДЕЯТЕЛЬНОСТИ", "type": "", "subgroup": "", "teacher": "Пащинская Л.И.", "room": "а. 542 С И В"}]}, {"num": "4", "time": "13:35", "lessons": [{"subject": "МЕНЕДЖМЕНТ В ПРОФЕССИОНАЛЬНОЙ ДЕЯТЕЛЬНОСТИ", "type": "", "subgroup": "", "teacher": "Пащинская Л.И.", "room": "а. 542 С И В"}]}], "Вторник": [{"num": "3", "time": "11:50", "lessons": [{"subject": "БЖД", "type": "", "subgroup": "", "teacher": "Жесткова Т.В.", "room": "а. 3 а"}]}, {"num": "4", "time": "13:35", "lessons": [{"subject": "БЖД", "type": "", "subgroup": "", "teacher": "Жесткова Т.В.", "room": "а. 3 а"}]}, {"num": "5", "time": "15:20", "lessons": [{"subject": "ОСНОВЫ СОЦИОЛОГИИ И ПОЛИТОЛОГИИ", "type": "", "subgroup": "", "teacher": "Тыртычный А.Э.", "room": "а. 6"}]}, {"num": "6", "time": "17:05", "lessons": [{"subject": "ОСНОВЫ СОЦИОЛОГИИ И ПОЛИТОЛОГИИ", "type": "", "subgroup": "", "teacher": "Тыртычный А.Э.", "room": "а. 6"}]}], "Среда": [], "Четверг": [{"num": "3", "time": "11:50", "lessons": [{"subject": "ФИЗИЧЕСКАЯ КУЛЬТУРА спорт.зал,тренажерный зал, стадион", "type": "", "subgroup": "", "teacher": "Калугин С.Л., Платонов Э.В., Тихонов М.С.", "room": ""}]}, {"num": "4", "time": "13:35", "lessons": [{"subject": "ИНОСТРАННЫЙ ЯЗЫК В ПРОФЕССИОНАЛЬНОЙ ДЕЯТЕЛЬНОСТИ", "type": "", "subgroup": "", "teacher": "Сидельникова И.В.", "room": "а. Общ. 2"}]}, {"num": "5", "time": "15:20", "lessons": [{"subject": "СТАНДАРТИЗАЦИЯ, СЕРТИФИКАЦИЯ И ТЕХНИЧЕСКОЕ ДОКУМЕНТОВЕДЕНИЕ", "type": "", "subgroup": "", "teacher": "Пачевская Е.Н.", "room": "а. 6"}]}, {"num": "6", "time": "17:05", "lessons": [{"subject": "СТАНДАРТИЗАЦИЯ, СЕРТИФИКАЦИЯ И ТЕХНИЧЕСКОЕ ДОКУМЕНТОВЕДЕНИЕ", "type": "", "subgroup": "", "teacher": "Пачевская Е.Н.", "room": "а. 6"}]}], "Пятница": [], "Суббота": [{"num": "1", "time": "8:00", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "лаб.", "subgroup": "1 под.", "teacher": "Резникова В.Ю.", "room": "а."}]}, {"num": "2", "time": "9:45", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "лаб.", "subgroup": "1 под.", "teacher": "Резникова В.Ю.", "room": "а."}]}, {"num": "3", "time": "11:30", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "теория", "subgroup": "", "teacher": "Резникова В.Ю.", "room": "а."}]}, {"num": "4", "time": "13:10", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "теория", "subgroup": "", "teacher": "Резникова В.Ю.", "room": "а."}]}, {"num": "5", "time": "15:00", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "лаб.", "subgroup": "2 под.", "teacher": "Резникова В.Ю.", "room": "а."}]}, {"num": "6", "time": "16:35", "lessons": [{"subject": "МДК.01.02 РАЗРАБОТКА КОДА ИС", "type": "лаб.", "subgroup": "2 под.", "teacher": "Резникова В.Ю.", "room": "а."}]}]}};

const DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб"];

const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
};

const todayIdx = (new Date().getDay() + 6) % 7;   // Пн = 0 … Вс = 6

const state = {
  group: DATA[store.get('rasp.group')] ? store.get('rasp.group') : Object.keys(DATA)[0],
  sub: ['all', '1', '2'].includes(store.get('rasp.sub')) ? store.get('rasp.sub') : 'all',
  day: todayIdx < 6 ? todayIdx : 0                 // в воскресенье сразу показываем понедельник
};

const groupEl = document.getElementById('group');
const subEl = document.getElementById('sub');
const daysEl = document.getElementById('days');
const listEl = document.getElementById('list');

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function subOf(lesson){
  const m = (lesson.subgroup || '').match(/\d/);
  return m ? m[0] : '';
}

function slotsFor(group, dayIdx){
  return (DATA[group][DAYS[dayIdx]] || [])
    .map(s => ({
      num: s.num,
      time: s.time,
      lessons: s.lessons.filter(l => state.sub === 'all' || !subOf(l) || subOf(l) === state.sub)
    }))
    .filter(s => s.lessons.length);
}

function pairs(n){
  const a = n % 10, b = n % 100;
  const w = a === 1 && b !== 11 ? 'пара' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'пары' : 'пар';
  return n + ' ' + w;
}

// «ИНОСТРАННЫЙ ЯЗЫК В …» → «Иностранный язык в …», аббревиатуры (БЖД, ИС) не трогаем
const SMALL = new Set(['и','в','во','на','по','от','для','с','со','к','о','об','из','за','при','под','без','до','или']);
function fixCase(s){
  if (s !== s.toUpperCase()) return s;
  const r = s.split(' ').map(w => {
    const low = w.toLowerCase();
    const letters = w.replace(/[^A-Za-zА-Яа-яЁё]/g, '');
    if (SMALL.has(low)) return low;
    if (/\d/.test(w) || (letters.length >= 2 && letters.length <= 3)) return w;
    return low;
  }).join(' ');
  return r.charAt(0).toUpperCase() + r.slice(1);
}

function tidy(l){
  let subject = (l.subject || '').replace(/\s+/g, ' ').trim();

  // «ФИЗИЧЕСКАЯ КУЛЬТУРА спорт.зал, …» — хвост строчными буквами это место проведения
  let note = '';
  const cut = subject.search(/\s[а-яё]/);
  if (cut > 0 && subject.slice(0, cut) === subject.slice(0, cut).toUpperCase()){
    note = subject.slice(cut + 1).replace(/\s*,\s*/g, ', ');
    subject = subject.slice(0, cut);
  }

  // «МДК.01.02 РАЗРАБОТКА КОДА ИС» — код дисциплины отдельной меткой
  let code = '';
  const m = subject.match(/^([A-ZА-ЯЁ]{2,5}\.[\d.]+)\s+(.+)$/);
  if (m){ code = m[1]; subject = m[2]; }

  let room = (l.room || '').trim();
  if (/^а\.?$/.test(room)) room = '';   // пустая аудитория «а.»

  return {
    code,
    subject: fixCase(subject),
    room: room || note,
    teacher: (l.teacher || '').trim(),
    type: (l.type || '').trim(),
    sg: subOf(l)
  };
}

function lessonItem(l){
  const t = tidy(l);
  const item = el('div', 'item');
  item.append(el('div', 'subj', t.subject));

  const meta = el('div', 'meta');
  if (t.room) meta.append(el('span', 'room', t.room));
  if (t.teacher) meta.append(el('span', null, t.teacher));
  if (t.type) meta.append(el('span', 'tag', t.type));
  if (t.sg && state.sub === 'all') meta.append(el('span', 'tag sg', t.sg + ' подгр.'));
  if (t.code) meta.append(el('span', 'tag', t.code));
  item.append(meta);
  return item;
}

function render(){
  for (const b of groupEl.children) b.setAttribute('aria-pressed', b.dataset.v === state.group);
  for (const b of subEl.children) b.setAttribute('aria-pressed', b.dataset.v === state.sub);

  daysEl.replaceChildren(...DAYS.map((name, i) => {
    const n = slotsFor(state.group, i).length;
    const b = el('button');
    b.type = 'button';
    b.dataset.i = i;
    b.setAttribute('aria-pressed', i === state.day);
    b.setAttribute('aria-label', name + (i === todayIdx ? ', сегодня' : '') + ', ' + (n ? pairs(n) : 'пар нет'));
    b.classList.toggle('off', !n);
    b.classList.toggle('today', i === todayIdx);
    b.append(SHORT[i], el('small', null, n || '—'));
    return b;
  }));

  const slots = slotsFor(state.group, state.day);

  const head = el('div', 'dayhead');
  const h = el('h2', null, DAYS[state.day]);
  if (state.day === todayIdx) h.append(el('em', null, 'сегодня'));
  head.append(h, el('span', null, slots.length ? pairs(slots.length) + ' · с ' + slots[0].time : ''));

  let body;
  if (!slots.length){
    body = el('div', 'empty', 'Пар нет');
  } else {
    body = el('ol', 'lessons');
    for (const s of slots){
      const li = el('li', 'lesson');
      const when = el('div', 'when');
      when.append(el('b', null, s.time), el('span', null, s.num + ' пара'));
      const what = el('div');
      s.lessons.forEach(l => what.append(lessonItem(l)));
      li.append(when, what);
      body.append(li);
    }
  }
  listEl.replaceChildren(head, body);
}

function go(delta){
  const d = state.day + delta;
  if (d >= 0 && d < DAYS.length){ state.day = d; render(); }
}

// кнопки групп берём из данных
groupEl.append(...Object.keys(DATA).map(g => {
  const b = el('button', null, g);
  b.type = 'button';
  b.dataset.v = g;
  return b;
}));

// смена группы/подгруппы НЕ сбрасывает выбранный день
groupEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.group = b.dataset.v;
  store.set('rasp.group', state.group);
  render();
});

subEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.sub = b.dataset.v;
  store.set('rasp.sub', state.sub);
  render();
});

daysEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  state.day = +b.dataset.i;
  render();
});

// свайп влево/вправо — соседний день
let sx = 0, sy = 0, tracking = false;
document.addEventListener('touchstart', e => {
  tracking = e.touches.length === 1;
  if (tracking){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!tracking) return;
  tracking = false;
  const t = e.changedTouches[0];
  const dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
});

render();
</script>
</body>
</html>
