<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <script>if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') location.replace('https:' + location.href.slice(5));</script>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
        <title>Расписание</title>
        <link rel="icon" href="favicon.ico">
        <link rel="apple-touch-icon" href="favicon.ico">
        <style>
            :root {
                --bg: #f2f4f7;
                --surface: #ffffff;
                --line: #e0e4ea;
                --text: #10151c;
                --muted: #5b6574;
                --accent: #2563eb;
                --accent-ink: #ffffff;
                --accent-soft: #e3ebfc;
                --accent-text: #1d4ed8;
                --tag: #eef1f5;
                --wheel-alt: #dde2ea;
                --wheel-alt-ink: #10151c;
                --backdrop: rgba(8, 12, 18, .45);
                --tick: rgba(16, 21, 28, .28);
                --tick-strong: rgba(16, 21, 28, .5);
                --ease: cubic-bezier(.25, .8, .25, 1);
                color-scheme: light;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0d1117;
                    --surface: #151b23;
                    --line: #252d38;
                    --text: #e6ebf1;
                    --muted: #8d98a7;
                    --accent: #2f6fe8;
                    --accent-ink: #ffffff;
                    --accent-soft: #1a2b48;
                    --accent-text: #93b8ff;
                    --tag: #1e2530;
                    --wheel-alt: #27303c;
                    --wheel-alt-ink: #e6ebf1;
                    --backdrop: rgba(0, 0, 0, .6);
                    --tick: rgba(255, 255, 255, .32);
                    --tick-strong: rgba(255, 255, 255, .6);
                    color-scheme: dark;
                }
            }

            * { box-sizing: border-box; }
            html {
                -webkit-text-size-adjust: 100%;
                touch-action: pan-x pan-y;  /* Без зума щипком и двойным тапом. */
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                -webkit-font-smoothing: antialiased;
                overflow-x: hidden;
                -webkit-user-select: none;  /* Интерфейс пальцем не выделяется. */
                user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }

            /* А вот текст пар (предмет, время, аудиторию, преподавателя) выделить и скопировать можно */
            .dayhead,
            .lessons {
                -webkit-user-select: text;
                user-select: text;
                -webkit-touch-callout: default;
            }
            button {
                font: inherit;
                color: inherit;
                background: none;
                border: 0;
                margin: 0;
                padding: 0;
                cursor: pointer;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
                user-select: none;
            }
            button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

            /* Колонка на весь экран: список растягивается, кнопка рулетки прижата к низу */
            .app {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                min-height: 100dvh;
                max-width: 560px;
                margin: 0 auto;
                padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
            }

            /* шапка */
            .head {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 12px;
            }
            .head h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
            .head span { color: var(--muted); font-size: 13px; }

            /* плашка, которая переезжает под выбранную кнопку */
            .thumb {
                position: absolute;
                top: 0;
                left: 0;
                pointer-events: none;
                transition: transform .32s var(--ease), width .32s var(--ease), height .32s var(--ease);
            }
            .thumb.instant { transition: none; }

            /* группа + подгруппа */
            .controls { display: flex; flex-wrap: wrap; gap: 8px; }
            .seg {
                position: relative;
                flex: 1 1 200px;
                display: flex;
                gap: 2px;
                padding: 3px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .seg::-webkit-scrollbar { display: none; }
            .seg.sub { flex-basis: 250px; }
            .seg[hidden] { display: none; }
            .seg .thumb { border-radius: 9px; background: var(--accent-soft); }
            .seg button {
                position: relative;
                z-index: 1;
                flex: 1 0 auto;
                height: 38px;
                padding: 0 12px;
                border-radius: 9px;
                color: var(--muted);
                font-size: 14px;
                font-weight: 600;
                white-space: nowrap;
                transition: color .25s, transform .12s var(--ease);
            }
            .seg button:active { transform: scale(.95); }
            .seg button[aria-pressed="true"] { color: var(--accent-text); }

            /* дни */
            .days {
                position: relative;
                display: grid;
                grid-template-columns: repeat(6, 1fr);
                gap: 6px;
                margin: 12px 0 20px;
            }
            .days .thumb { border-radius: 12px; background: var(--accent); }
            .days button {
                position: relative;
                height: 52px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 1px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 12px;
                font-size: 15px;
                font-weight: 700;
                transition: color .25s, border-color .25s;
            }
            .days button > span,
            .days button > small { position: relative; z-index: 1; }
            .days small {
                font-size: 12px;
                font-weight: 600;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
                transition: color .25s;
            }
            .days button.off { color: var(--muted); }
            .days button.today::after {
                content: '';
                position: absolute;
                z-index: 1;
                top: 6px;
                right: 6px;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--accent);
                transition: background-color .25s;
            }
            .days button[aria-pressed="true"] { color: var(--accent-ink); border-color: transparent; }
            .days button[aria-pressed="true"] small { color: inherit; opacity: .8; }
            .days button[aria-pressed="true"].today::after { background: var(--accent-ink); }

            @media (hover: hover) {
                .seg button[aria-pressed="false"]:hover { color: var(--text); }
                .days button[aria-pressed="false"]:hover { border-color: var(--muted); }
                .roulette-open:hover { color: var(--text); border-color: var(--muted); }
            }

            /* список пар */
            .list {
                flex: 1 0 auto;  /* Занимает всё свободное место: свайпать можно и по пустому месту. */
                touch-action: pan-y;
            }
            .dayhead {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 12px;
                margin: 0 2px 10px;
            }
            .dayhead h2 { margin: 0; font-size: 18px; font-weight: 700; }
            .dayhead em {
                font-style: normal;
                font-size: 13px;
                font-weight: 600;
                color: var(--accent-text);
                margin-left: 8px;
            }
            .dayhead span { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }

            .lessons {
                list-style: none;
                margin: 0;
                padding: 0;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 14px;
                overflow: hidden;
            }
            .lesson {
                display: grid;
                grid-template-columns: 56px 1fr;
                gap: 10px;
                padding: 12px 14px;
            }
            .lesson + .lesson { border-top: 1px solid var(--line); }
            .when { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
            .when b { font-size: 15px; font-weight: 700; }
            .when .end { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
            .when .num { margin-top: 3px; font-size: 11.5px; color: var(--muted); }

            .item + .item { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
            .subj { font-size: 15px; font-weight: 600; line-height: 1.3; }
            .meta {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 4px 8px;
                margin-top: 4px;
                font-size: 13px;
                color: var(--muted);
            }
            .room { color: var(--text); font-weight: 600; }
            .tag {
                font-size: 11.5px;
                font-weight: 600;
                padding: 1px 7px;
                border-radius: 6px;
                background: var(--tag);
                color: var(--muted);
            }
            .tag.sg { background: var(--accent-soft); color: var(--accent-text); }

            .empty {
                padding: 28px 16px;
                text-align: center;
                color: var(--muted);
                background: var(--surface);
                border: 1px dashed var(--line);
                border-radius: 14px;
            }

            /* строки появляются по очереди при смене группы/подгруппы */
            @keyframes rowIn {
                from { opacity: 0; transform: translateY(6px); }
                to { opacity: 1; transform: none; }
            }
            .stagger .dayhead,
            .stagger .lesson,
            .stagger .empty {
                animation: rowIn .32s var(--ease) both;
                animation-delay: calc(var(--i, 0) * 35ms);
            }

            /* Кнопка рулетки внизу страницы */
            .foot {
                display: flex;
                justify-content: center;
                padding-top: 24px;
            }
            .roulette-open {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                height: 44px;
                padding: 0 18px;
                background: var(--surface);
                border: 1px solid var(--line);
                border-radius: 999px;
                color: var(--muted);
                font-size: 14px;
                font-weight: 600;
                transition: color .25s, border-color .25s, transform .12s var(--ease);
            }
            .roulette-open svg {
                width: 18px;
                height: 18px;
            }
            .roulette-open:active { transform: scale(.95); }

            /* Рулетка: шторка, выезжающая снизу */
            html.locked,
            html.locked body { overflow: hidden; }
            .sheet-wrap {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: flex;
                align-items: flex-end;
                justify-content: center;
            }
            .sheet-wrap[hidden] { display: none; }
            .sheet-backdrop {
                position: absolute;
                inset: 0;
                background: var(--backdrop);
                opacity: 0;
                transition: opacity .3s var(--ease);
                touch-action: none;
            }
            .sheet {
                position: relative;
                width: 100%;
                max-width: 480px;
                max-height: 100%;
                overflow-x: hidden;  /* Углы повёрнутого колеса не должны давать прокрутку вбок. */
                overflow-y: auto;
                overscroll-behavior: contain;
                scrollbar-width: none;
                padding: 0 20px calc(20px + env(safe-area-inset-bottom, 0px));
                background: var(--surface);
                border: 1px solid var(--line);
                border-bottom: 0;
                border-radius: 20px 20px 0 0;
                transform: translateY(100%);
                transition: transform .36s var(--ease);
            }
            .sheet::-webkit-scrollbar { display: none; }
            .sheet-wrap.open .sheet-backdrop { opacity: 1; }
            .sheet-wrap.open .sheet { transform: none; }
            .sheet-grab {
                padding-top: 10px;
                touch-action: none;  /* Тянем шторку пальцем вниз. */
            }
            .sheet-handle {
                width: 40px;
                height: 5px;
                margin: 0 auto 6px;
                border-radius: 3px;
                background: var(--line);
            }
            .sheet-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }
            .sheet-head h2 {
                margin: 0;
                font-size: 18px;
                font-weight: 700;
            }
            .sheet-close {
                display: grid;
                place-items: center;
                width: 40px;
                height: 40px;
                margin-right: -6px;
                border-radius: 50%;
                background: var(--tag);
                color: var(--muted);
                transition: transform .12s var(--ease);
            }
            .sheet-close svg {
                width: 18px;
                height: 18px;
            }
            .sheet-close:active { transform: scale(.9); }

            /* Колесо: доля синей половинки плавно меняется через --split */
            @property --split {
                syntax: '<percentage>';
                inherits: false;
                initial-value: 50%;
            }
            .wheel-box {
                --size: min(72vw, 300px, 40vh);
                --size: min(72vw, 300px, 40dvh);
                position: relative;
                width: var(--size);
                height: var(--size);
                margin: 24px auto 0;
            }
            .wheel-pointer {
                position: absolute;
                z-index: 2;
                top: -12px;
                left: 50%;
                width: 0;
                height: 0;
                border-left: 11px solid transparent;
                border-right: 11px solid transparent;
                border-top: 20px solid var(--text);
                transform: translateX(-50%) rotate(var(--kick, 0deg));  /* --kick - отскок от рисок. */
                transform-origin: 50% 0;
                filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .25));
            }
            .wheel-spin {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                cursor: pointer;
                will-change: transform;
                -webkit-tap-highlight-color: transparent;
            }
            .wheel {
                position: relative;
                width: 100%;
                height: 100%;
                border-radius: 50%;
                background: conic-gradient(var(--accent) 0 var(--split), var(--wheel-alt) var(--split) 100%);
                box-shadow: 0 0 0 1px var(--line), inset 0 0 0 5px var(--surface);
                transition: --split .6s var(--ease);
            }

            /* Риски по краю колеса: короткие на каждый 1%, длинные на каждые 10% */
            .wheel::before,
            .wheel::after {
                content: '';
                position: absolute;
                inset: 5px;
                border-radius: 50%;
                pointer-events: none;
            }
            .wheel::before {
                background: repeating-conic-gradient(from -.25deg, var(--tick) 0 .5deg, transparent .5deg 3.6deg);
                -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 8px), #000 calc(100% - 8px));
                mask: radial-gradient(circle closest-side, transparent calc(100% - 8px), #000 calc(100% - 8px));
            }
            .wheel::after {
                background: repeating-conic-gradient(from -.4deg, var(--tick-strong) 0 .8deg, transparent .8deg 36deg);
                -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 14px), #000 calc(100% - 14px));
                mask: radial-gradient(circle closest-side, transparent calc(100% - 14px), #000 calc(100% - 14px));
            }
            .wheel-label {
                position: absolute;
                left: 50%;
                top: 50%;
                display: flex;
                flex-direction: column;
                align-items: center;
                line-height: 1.15;
                white-space: nowrap;
                transform: translate(-50%, -50%) rotate(var(--mid, 0deg)) translateY(calc(var(--size) * -0.28));
                transition: transform .6s var(--ease), opacity .3s;
            }
            .wheel-label.tiny { opacity: 0; }
            .wheel-label b {
                font-size: 15px;
                font-weight: 700;
            }
            .wheel-label span {
                font-size: 13px;
                font-weight: 600;
                opacity: .85;
                font-variant-numeric: tabular-nums;
            }
            .wheel-label.go { color: var(--accent-ink); }
            .wheel-label.skip { color: var(--wheel-alt-ink); }
            .wheel-hub {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 16%;
                height: 16%;
                border-radius: 50%;
                background: var(--surface);
                box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0, 0, 0, .18);
                transform: translate(-50%, -50%);
                pointer-events: none;
            }

            /* Результат и кнопки под колесом */
            .roulette-result {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 56px;
                margin-top: 18px;
                text-align: center;
            }
            .roulette-result b {
                font-size: 20px;
                font-weight: 800;
            }
            .roulette-result span {
                font-size: 13px;
                color: var(--muted);
            }
            .roulette-result.go b { color: var(--accent-text); }
            .roulette-result.pop { animation: pop .45s var(--ease); }
            @keyframes pop {
                0% { opacity: 0; transform: scale(.85); }
                60% { opacity: 1; transform: scale(1.06); }
                100% { transform: none; }
            }
            .sheet-actions {
                display: grid;
                margin-top: 14px;
            }
            .btn {
                height: 50px;
                border-radius: 14px;
                font-size: 15px;
                font-weight: 700;
                transition: transform .12s var(--ease), opacity .2s;
            }
            .btn:active { transform: scale(.97); }
            .btn:disabled {
                opacity: .5;
                cursor: default;
            }
            .btn-main {
                background: var(--accent);
                color: var(--accent-ink);
            }

            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after { animation: none !important; transition: none !important; }
            }
        </style>
    </head>
    <body>
        <main class="app">
            <header class="head">
                <h1 id="title">Расписание</h1>
                <span id="subtitle"></span>
            </header>
            <div class="controls">
                <div class="seg" id="group" role="group" aria-label="Группа"></div>
                <div class="seg sub" id="sub" role="group" aria-label="Подгруппа"></div>
            </div>
            <nav class="days" id="days" aria-label="День недели"></nav>
            <section class="list" id="list"></section>
            <footer class="foot">
                <button type="button" class="roulette-open" id="rouletteOpen">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 3v18"/>
                        <circle cx="12" cy="12" r="2" fill="currentColor"/>
                    </svg>
                    Рулетка
                </button>
            </footer>
        </main>

        <!-- Рулетка: идти на пары или нет -->
        <div class="sheet-wrap" id="roulette" hidden>
            <div class="sheet-backdrop" data-close></div>
            <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="rouletteTitle">
                <div class="sheet-grab" id="sheetGrab">
                    <div class="sheet-handle"></div>
                    <header class="sheet-head">
                        <h2 id="rouletteTitle">Идти на пары?</h2>
                        <button type="button" class="sheet-close" data-close aria-label="Закрыть">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                                <path d="M6 6l12 12M18 6L6 18"/>
                            </svg>
                        </button>
                    </header>
                </div>
                <div class="wheel-box">
                    <div class="wheel-pointer"></div>
                    <div class="wheel-spin" id="wheelSpin">
                        <div class="wheel" id="wheel">
                            <div class="wheel-label go" id="labelGo"><b>Идти</b><span>50%</span></div>
                            <div class="wheel-label skip" id="labelSkip"><b>Не идти</b><span>50%</span></div>
                        </div>
                    </div>
                    <div class="wheel-hub"></div>
                </div>
                <div class="roulette-result" id="rouletteResult" aria-live="polite"></div>
                <div class="sheet-actions">
                    <button type="button" class="btn btn-main" id="rouletteSpin">Крутить</button>
                </div>
            </section>
        </div>

        <!-- Всё расписание лежит в schedule.js -->
        <script src="schedule.js"></script>
        <script>
            const DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
            const SHORT = ["Пн","Вт","Ср","Чт","Пт","Сб"];

            const groupEl = document.getElementById('group');
            const subEl = document.getElementById('sub');
            const daysEl = document.getElementById('days');
            const listEl = document.getElementById('list');
            const rouletteEl = document.getElementById('roulette');
            const footEl = document.querySelector('.foot');

            const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

            function el(tag, cls, text){
                const e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text != null) e.textContent = text;
                return e;
            }

            if (typeof SCHEDULE === 'undefined'){
                listEl.append(el('div', 'empty', 'Не найден файл schedule.js рядом с index.html'));
                throw new Error('schedule.js не загружен');
            }

            const S = SCHEDULE;
            const GROUPS = Object.keys(S.groups);

            const store = {
                get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
            };

            const todayIdx = (new Date().getDay() + 6) % 7;  // Пн = 0 … Вс = 6.

            const state = {
                group: GROUPS.includes(store.get('rasp.group')) ? store.get('rasp.group') : GROUPS[0],
                sub: store.get('rasp.sub') || 'all',
                day: todayIdx < 6 ? todayIdx : 0  // В воскресенье сразу показываем понедельник.
            };

            /* ---------- данные ---------- */

            function toMin(t){
                const [h, m] = t.split(':').map(Number);
                return h * 60 + m;
            }
            function fmt(min){
                return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0');
            }

            // Время пары: своё (time у занятия) → звонки дня → общие звонки; конец = начало + pairMinutes:
            function timeOf(day, pair, own){
                const bells = S.bells || {};
                const raw = own || (bells[day] && bells[day][pair]) || (bells.default && bells.default[pair]) || '';
                const [start, end] = String(raw).split(/\s*[-–]\s*/);
                if (!start) return { start: '?', end: '?' };
                return { start, end: end || fmt(toMin(start) + (S.pairMinutes || 90)) };
            }

            // Разворачиваем pair: [3, 4] в две отдельные пары:
            function lessonsOf(group, day){
                const out = [];
                for (const l of (S.groups[group] || {})[day] || []){
                    for (const p of [].concat(l.pair)) out.push(Object.assign({}, l, { pair: p }));
                }
                return out;
            }

            function subsOf(group){
                const set = new Set();
                for (const day of DAYS) for (const l of lessonsOf(group, day)) if (l.sub) set.add(String(l.sub));
                return [...set].sort();
            }

            function slotsFor(group, dayIdx){
                const day = DAYS[dayIdx];
                const map = new Map();
                for (const l of lessonsOf(group, day)){
                    if (state.sub !== 'all' && l.sub && String(l.sub) !== state.sub) continue;
                    if (!map.has(l.pair)) map.set(l.pair, { pair: l.pair, time: timeOf(day, l.pair, l.time), lessons: [] });
                    map.get(l.pair).lessons.push(l);
                }
                return [...map.values()].sort((a, b) => a.pair - b.pair);
            }

            function pairs(n){
                const a = n % 10, b = n % 100;
                const w = a === 1 && b !== 11 ? 'пара' : a >= 2 && a <= 4 && (b < 12 || b > 14) ? 'пары' : 'пар';
                return n + ' ' + w;
            }

            /* ---------- переключатели ---------- */

            function moveThumb(container, btn, instant){
                const t = container.querySelector(':scope > .thumb');
                if (!t || !btn) return;
                t.classList.toggle('instant', !!instant);
                t.style.width = btn.offsetWidth + 'px';
                t.style.height = btn.offsetHeight + 'px';
                t.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
                if (instant){ void t.offsetWidth; t.classList.remove('instant'); }
            }

            function buildSeg(segEl, items){
                segEl.replaceChildren(el('div', 'thumb'), ...items.map(([v, label]) => {
                    const b = el('button', null, label);
                    b.type = 'button';
                    b.dataset.v = v;
                    return b;
                }));
            }

            function setSeg(segEl, value, instant){
                let active = null;
                for (const b of segEl.querySelectorAll('button')){
                    const on = b.dataset.v === value;
                    b.setAttribute('aria-pressed', on);
                    if (on) active = b;
                }
                moveThumb(segEl, active, instant);
                if (active && segEl.scrollWidth > segEl.clientWidth){
                    active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: instant ? 'auto' : 'smooth' });
                }
            }

            // Подгруппы берём из данных выбранной группы; если их нет - переключатель прячется:
            let subKey = null;
            function syncSubs(){
                const subs = subsOf(state.group);
                if (!['all', ...subs].includes(state.sub)) state.sub = 'all';
                const key = subs.join(',');
                if (key === subKey) return false;
                subKey = key;
                subEl.hidden = !subs.length;
                buildSeg(subEl, [['all', 'Все'], ...subs.map(s => [s, s + ' подгр.'])]);
                return true;
            }

            buildSeg(groupEl, GROUPS.map(g => [g, g]));

            const dayBtns = DAYS.map((name, i) => {
                const b = el('button');
                b.type = 'button';
                b.dataset.i = i;
                b.classList.toggle('today', i === todayIdx);
                b.append(el('span', null, SHORT[i]), el('small'));
                return b;
            });
            daysEl.append(...dayBtns, el('div', 'thumb'));

            /* ---------- отрисовка ---------- */

            function lessonItem(l){
                const item = el('div', 'item');
                item.append(el('div', 'subj', l.subject));
                const meta = el('div', 'meta');
                if (l.room) meta.append(el('span', 'room', l.room));
                if (l.teacher) meta.append(el('span', null, l.teacher));
                if (l.type) meta.append(el('span', 'tag', l.type));
                if (l.sub && state.sub === 'all') meta.append(el('span', 'tag sg', l.sub + ' подгр.'));
                if (l.code) meta.append(el('span', 'tag', l.code));
                item.append(meta);
                return item;
            }

            function renderList(){
                const slots = slotsFor(state.group, state.day);

                const head = el('div', 'dayhead');
                const h = el('h2', null, DAYS[state.day]);
                if (state.day === todayIdx) h.append(el('em', null, 'сегодня'));
                head.append(h, el('span', null, slots.length
                    ? pairs(slots.length) + ' · ' + slots[0].time.start + ' – ' + slots[slots.length - 1].time.end
                    : ''));

                let body;
                if (!slots.length){
                    body = el('div', 'empty', 'Пар нет');
                    body.style.setProperty('--i', 1);
                } else {
                    body = el('ol', 'lessons');
                    slots.forEach((s, i) => {
                        const li = el('li', 'lesson');
                        li.style.setProperty('--i', i + 1);
                        const when = el('div', 'when');
                        when.setAttribute('aria-label', `${s.pair} пара, с ${s.time.start} до ${s.time.end}`);
                        when.append(el('b', null, s.time.start), el('span', 'end', '– ' + s.time.end), el('span', 'num', s.pair + ' пара'));
                        const what = el('div');
                        s.lessons.forEach(l => what.append(lessonItem(l)));
                        li.append(when, what);
                        body.append(li);
                    });
                }
                listEl.replaceChildren(head, body);
            }

            // anim: 'slide' (смена дня), 'stagger' (смена группы/подгруппы) или ничего (первый показ):
            function render(anim, dir){
                const instant = !anim;
                const footTop = footEl.getBoundingClientRect().top;  // Где была кнопка рулетки до перерисовки.
                const subsRebuilt = syncSubs();

                setSeg(groupEl, state.group, instant);
                setSeg(subEl, state.sub, instant || subsRebuilt);

                dayBtns.forEach((b, i) => {
                    const n = slotsFor(state.group, i).length;
                    b.setAttribute('aria-pressed', i === state.day);
                    b.setAttribute('aria-label', DAYS[i] + (i === todayIdx ? ', сегодня' : '') + ', ' + (n ? pairs(n) : 'пар нет'));
                    b.classList.toggle('off', !n);
                    b.lastChild.textContent = n || '—';
                });
                moveThumb(daysEl, dayBtns[state.day], instant);

                listEl.classList.toggle('stagger', anim === 'stagger' || !anim);
                renderList();

                if (anim === 'slide' && !reduceMotion.matches){
                    listEl.animate(
                        [{ opacity: 0, transform: `translateX(${dir * 40}px)` }, { opacity: 1, transform: 'none' }],
                        { duration: 260, easing: 'cubic-bezier(.25, .8, .25, 1)' }
                    );
                }
                if (anim) glideFoot(footTop, anim);
            }

            // Кнопка рулетки не прыгает при смене высоты списка, а плавно едет со старого места на новое:
            let footAnim = null;
            function glideFoot(oldTop, anim){
                if (reduceMotion.matches) return;
                const dy = oldTop - footEl.getBoundingClientRect().top;
                if (footAnim) footAnim.cancel();
                if (Math.abs(dy) < 1) return;
                // При «вываливании» пар едем вместе с ними: чем больше строк, тем дольше:
                const rows = listEl.querySelectorAll('.lesson').length;
                const duration = anim === 'stagger' ? Math.min(320 + rows * 35, 650) : 300;
                footAnim = footEl.animate(
                    [{ transform: `translateY(${dy}px)` }, { transform: 'none' }],
                    { duration, easing: 'cubic-bezier(.25, .8, .25, 1)' }
                );
            }

            function goDay(i){
                if (i < 0 || i >= DAYS.length || i === state.day) return;
                const dir = i > state.day ? 1 : -1;
                state.day = i;
                render('slide', dir);
            }

            /* ---------- события ---------- */

            // Смена группы/подгруппы НЕ сбрасывает выбранный день:
            groupEl.addEventListener('click', e => {
                const b = e.target.closest('button');
                if (!b || b.dataset.v === state.group) return;
                state.group = b.dataset.v;
                store.set('rasp.group', state.group);
                render('stagger');
            });

            subEl.addEventListener('click', e => {
                const b = e.target.closest('button');
                if (!b || b.dataset.v === state.sub) return;
                state.sub = b.dataset.v;
                store.set('rasp.sub', state.sub);
                render('stagger');
            });

            daysEl.addEventListener('click', e => {
                const b = e.target.closest('button');
                if (b) goDay(+b.dataset.i);
            });

            document.addEventListener('keydown', e => {
                if (e.altKey || e.ctrlKey || e.metaKey) return;
                if (!rouletteEl.hidden){
                    if (e.key === 'Escape') closeRoulette();
                    return;
                }
                if (e.key === 'ArrowRight') goDay(state.day + 1);
                else if (e.key === 'ArrowLeft') goDay(state.day - 1);
            });

            // Свайп: список едет за пальцем, отпустил дальше 60px - соседний день:
            let drag = null;

            listEl.addEventListener('touchstart', e => {
                drag = null;
                if (e.touches.length !== 1) return;
                const t = e.touches[0];
                drag = { x: t.clientX, y: t.clientY, dx: 0, axis: null };
            }, { passive: true });

            listEl.addEventListener('touchmove', e => {
                if (!drag) return;
                const t = e.touches[0];
                const dx = t.clientX - drag.x, dy = t.clientY - drag.y;
                if (!drag.axis){
                    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
                    drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
                }
                if (drag.axis !== 'x') return;
                drag.dx = dx;
                if (reduceMotion.matches) return;
                const atEdge = (dx > 0 && state.day === 0) || (dx < 0 && state.day === DAYS.length - 1);
                const shift = dx * (atEdge ? 0.2 : 0.6);
                listEl.style.transform = `translateX(${shift}px)`;
                listEl.style.opacity = String(1 - Math.min(Math.abs(shift) / 400, 0.5));
            }, { passive: true });

            function endDrag(){
                if (!drag || drag.axis !== 'x'){ drag = null; return; }
                const dx = drag.dx;
                drag = null;

                const dir = dx < 0 ? 1 : -1;
                const next = state.day + dir;
                const from = { transform: listEl.style.transform || 'none', opacity: listEl.style.opacity || '1' };
                listEl.style.transform = '';
                listEl.style.opacity = '';

                const canGo = Math.abs(dx) > 60 && next >= 0 && next < DAYS.length;
                if (reduceMotion.matches){
                    if (canGo) goDay(next);
                    return;
                }
                if (canGo){
                    const out = listEl.animate(
                        [from, { transform: `translateX(${-dir * 80}px)`, opacity: 0 }],
                        { duration: 120, easing: 'ease-in', fill: 'forwards' }
                    );
                    setTimeout(() => { goDay(next); out.cancel(); }, 120);
                } else {
                    listEl.animate([from, { transform: 'none', opacity: 1 }], { duration: 220, easing: 'cubic-bezier(.25, .8, .25, 1)' });
                }
            }
            listEl.addEventListener('touchend', endDrag);
            listEl.addEventListener('touchcancel', endDrag);

            // при изменении ширины плашки переставляем без анимации
            new ResizeObserver(() => {
                moveThumb(groupEl, groupEl.querySelector('[aria-pressed="true"]'), true);
                moveThumb(subEl, subEl.querySelector('[aria-pressed="true"]'), true);
                moveThumb(daysEl, dayBtns[state.day], true);
            }).observe(document.querySelector('.app'));

            /* ---------- рулетка ---------- */

            const sheetEl = rouletteEl.querySelector('.sheet');
            const grabEl = document.getElementById('sheetGrab');
            const wheelSpinEl = document.getElementById('wheelSpin');
            const wheelEl = document.getElementById('wheel');
            const pointerEl = rouletteEl.querySelector('.wheel-pointer');
            const labelGoEl = document.getElementById('labelGo');
            const labelSkipEl = document.getElementById('labelSkip');
            const resultEl = document.getElementById('rouletteResult');
            const spinBtn = document.getElementById('rouletteSpin');
            const openBtn = document.getElementById('rouletteOpen');

            const roulette = { split: 50, rot: 0, spinning: false, id: 0, timer: 0 };  // split - доля «Идти» в процентах, id - номер спина.

            // Случайное целое от min до max включительно:
            function rand(min, max){
                return min + Math.floor(Math.random() * (max - min + 1));
            }

            // Показать результат (null - подсказка до вращения):
            function showResult(go){
                resultEl.classList.remove('go', 'pop');
                if (go === null){
                    const odds = `Идти ${roulette.split}% · Не идти ${100 - roulette.split}%`;
                    resultEl.replaceChildren(el('b', null, 'Крути колесо'), el('span', null, odds));
                    return;
                }
                const chance = go ? roulette.split : 100 - roulette.split;
                resultEl.replaceChildren(el('b', null, go ? 'Идём на пары' : 'Можно не идти'), el('span', null, `шанс был ${chance}%`));
                resultEl.classList.toggle('go', go);
                void resultEl.offsetWidth;
                resultEl.classList.add('pop');
            }

            // Поставить подпись в середину половинки (низом текста к центру колеса):
            function setLabelAngle(label, mid){
                label.style.setProperty('--mid', mid + 'deg');
            }

            // Новые случайные шансы при открытии: от 1/99 до 99/1:
            function shuffleOdds(){
                const go = rand(1, 99), skip = 100 - go;
                roulette.split = go;
                wheelEl.style.setProperty('--split', go + '%');
                setLabelAngle(labelGoEl, go * 1.8);
                setLabelAngle(labelSkipEl, go * 3.6 + skip * 1.8);
                labelGoEl.lastChild.textContent = go + '%';
                labelSkipEl.lastChild.textContent = skip + '%';
                labelGoEl.classList.toggle('tiny', go < 12);  // В узкую полоску подпись не влезает.
                labelSkipEl.classList.toggle('tiny', skip < 12);
                showResult(null);
            }

            // Крутим колесо: исход выпадает ровно с шансом своей половинки, стрелка встаёт внутрь неё:
            function spin(){
                if (roulette.spinning) return;
                const edge = roulette.split * 3.6;  // Граница половинок в градусах.
                const go = Math.random() * 100 < roulette.split;
                const [from, to] = go ? [0, edge] : [edge, 360];
                const pad = Math.min(4, (to - from) * 0.25);                    // Отступ от границы (у 1% полоска всего 3.6°).
                const at = from + pad + Math.random() * (to - from - pad * 2);  // Точка под стрелкой.

                roulette.rot = Math.ceil(roulette.rot / 360) * 360 + rand(5, 7) * 360 + (360 - at);
                roulette.spinning = true;
                spinBtn.disabled = true;
                resultEl.classList.remove('go', 'pop');
                resultEl.replaceChildren(el('b', null, 'Крутится…'), el('span', null, 'ну-ка, ну-ка'));

                const ms = reduceMotion.matches ? 0 : 4200;
                wheelSpinEl.style.transition = `transform ${ms}ms cubic-bezier(.12, .75, .15, 1)`;
                wheelSpinEl.style.transform = `rotate(${roulette.rot}deg)`;
                watchTicks(ms);

                roulette.timer = setTimeout(() => {
                    stopSpin();
                    spinBtn.textContent = 'Ещё раз';
                    showResult(go);
                }, ms + 50);
            }

            // Остановить вращение: в конце спина или abort - шторку закрыли на ходу (колесо замирает где было):
            function stopSpin(abort){
                clearTimeout(roulette.timer);
                roulette.id++;
                if (abort){
                    const m = new DOMMatrix(getComputedStyle(wheelSpinEl).transform);
                    roulette.rot = Math.atan2(m.b, m.a) * 180 / Math.PI + 360;
                }
                // Незаметно сбрасываем угол в 0-360°, иначе после многих вращений браузер округлит большое число:
                roulette.rot %= 360;
                wheelSpinEl.style.transition = 'none';
                wheelSpinEl.style.transform = `rotate(${roulette.rot}deg)`;
                pointerEl.style.setProperty('--kick', '0deg');
                roulette.spinning = false;
                spinBtn.disabled = false;
            }

            // Стрелка цепляет риски: каждый кадр смотрим угол колеса и на каждом 1% отбиваем её в сторону:
            function watchTicks(ms){
                if (reduceMotion.matches || !ms) return;
                const end = performance.now() + ms + 100;
                const id = roulette.id;
                let prev = null, abs = 0, kick = 0;

                const step = now => {
                    if (id !== roulette.id) return;  // Этот спин уже закончился или прерван.
                    const m = new DOMMatrix(getComputedStyle(wheelSpinEl).transform);
                    const deg = Math.atan2(m.b, m.a) * 180 / Math.PI;
                    if (prev === null) abs = (deg + 360) % 360;
                    else {
                        const d = Math.max(((deg - prev) % 360 + 540) % 360 - 180, 0);  // Поворот за кадр.
                        const before = Math.floor(abs / 3.6);
                        abs += d;
                        if (Math.floor(abs / 3.6) > before) kick = Math.min(10 + d * 2, 28);  // Чем быстрее колесо, тем сильнее удар.
                    }
                    prev = deg;
                    kick *= 0.75;
                    pointerEl.style.setProperty('--kick', -kick.toFixed(2) + 'deg');
                    if (now < end || kick > 0.2) requestAnimationFrame(step);
                    else pointerEl.style.setProperty('--kick', '0deg');
                };
                requestAnimationFrame(step);
            }

            // Открыть шторку (с записью в историю, чтобы «Назад» на телефоне её закрывал):
            function openRoulette(){
                if (!rouletteEl.hidden) return;
                rouletteEl.hidden = false;
                document.documentElement.classList.add('locked');
                if (!roulette.spinning){
                    shuffleOdds();
                    spinBtn.textContent = 'Крутить';
                }
                void sheetEl.offsetWidth;
                rouletteEl.classList.add('open');
                history.pushState({ roulette: true }, '');
            }

            // Закрыть шторку кнопкой, фоном, свайпом или Esc:
            function closeRoulette(){
                if (history.state && history.state.roulette) history.back();
                else hideRoulette();
            }

            // Спрятать шторку с анимацией (сюда же приходит кнопка «Назад»):
            function hideRoulette(){
                if (rouletteEl.hidden || !rouletteEl.classList.contains('open')) return;
                if (roulette.spinning) stopSpin(true);  // Закрыли на ходу - спин отменяется, при открытии всё с чистого листа.
                rouletteEl.classList.remove('open');
                sheetEl.style.transition = '';
                sheetEl.style.transform = '';
                document.documentElement.classList.remove('locked');
                setTimeout(() => {
                    if (!rouletteEl.classList.contains('open')) rouletteEl.hidden = true;
                }, reduceMotion.matches ? 0 : 360);
            }

            // Если страницу перезагрузили с открытой шторкой - убираем лишнюю запись в истории:
            if (history.state && history.state.roulette) history.replaceState(null, '');

            window.addEventListener('popstate', hideRoulette);
            openBtn.addEventListener('click', openRoulette);
            spinBtn.addEventListener('click', spin);
            wheelSpinEl.addEventListener('click', spin);
            rouletteEl.addEventListener('click', e => {
                if (e.target.closest('[data-close]')) closeRoulette();
            });

            // Шторку можно смахнуть вниз за верхнюю часть:
            let sheetDrag = null;

            grabEl.addEventListener('touchstart', e => {
                if (e.touches.length !== 1) return;
                sheetDrag = { y: e.touches[0].clientY, dy: 0, t: Date.now() };
                sheetEl.style.transition = 'none';
            }, { passive: true });

            grabEl.addEventListener('touchmove', e => {
                if (!sheetDrag) return;
                const dy = e.touches[0].clientY - sheetDrag.y;
                sheetDrag.dy = dy;
                sheetEl.style.transform = `translateY(${dy > 0 ? dy : dy * 0.2}px)`;
            }, { passive: true });

            // Отпустили шторку: далеко или резко - закрываем, иначе возвращаем на место:
            function endSheetDrag(){
                if (!sheetDrag) return;
                const { dy, t } = sheetDrag;
                sheetDrag = null;
                sheetEl.style.transition = '';
                const flick = dy > 40 && dy / (Date.now() - t) > 0.5;
                if (dy > 100 || flick) closeRoulette();
                else sheetEl.style.transform = '';
            }
            grabEl.addEventListener('touchend', endSheetDrag);
            grabEl.addEventListener('touchcancel', endSheetDrag);

            /* ---------- без зума, как в приложении ---------- */

            // iOS Safari игнорирует user-scalable=no, поэтому гасим жесты щипка вручную:
            document.addEventListener('gesturestart', e => e.preventDefault());
            document.addEventListener('touchmove', e => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });

            // На компьютере: Ctrl + колесо (и щипок на тачпаде), Ctrl + плюс/минус/ноль:
            document.addEventListener('wheel', e => {
                if (e.ctrlKey) e.preventDefault();
            }, { passive: false });
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && ['+', '=', '-', '_', '0'].includes(e.key)) e.preventDefault();
            });

            /* ---------- старт ---------- */

            document.getElementById('title').textContent = S.title || 'Расписание';
            document.getElementById('subtitle').textContent = S.subtitle || '';
            document.title = (S.title || 'Расписание') + ' · ' + GROUPS.join(' / ');

            render();

            // офлайн-режим (работает только на http/https, не при открытии файла с диска)
            if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
                    navigator.serviceWorker.register('sw.js');
            }
        </script>
    </body>
</html>
